[package]
name = "esp-csi-litetui-rs"
version = "0.1.0"
edition = "2024"
authors = ["Maryam Odat <mariam.odat97@gmail.com>", "Abdullah Al-Awad <abdullahalawad123321@gmail.com>"]

[dependencies]
esp-hal = { version = "1.0.0", features = ["esp32s3", "unstable", "psram"] }
esp-backtrace = { version = "0.18.1", optional = false, features = ["panic-handler", "esp32s3"] }
esp-println = { version = "0.16.1", optional = false, default-features = false, features = ["esp32s3",] }
esp-alloc = { version = "0.9.0", optional = false }

esp-rtos = { version = "0.2.0", optional = false, features = ["embassy", "esp32s3"] }

# Networking & Radio
esp-radio = { version = "0.17.0", features = ["esp32s3", "wifi", "sniffer", "csi", "esp-alloc"] }
esp-csi-rs = { version = "0.4.2", features = ["esp32s3", "statistics"] }

# Async & Utils
embassy-executor = { version = "0.9.1", optional = false }
embassy-time = { version = "0.5.0", optional = false }
static_cell = "2.1.0"
log = "0.4.22"
esp-bootloader-esp-idf = { version = "0.4.0", features = ["esp32s3"] }
embassy-futures = "0.1.2"

embedded-graphics = "0.8.1"
display-interface-spi = "0.5.0"
mipidsi = "0.8.0"
embedded-hal-bus = "0.2.0"
micromath = "2.1.0"

ratatui = { version = "0.30.0", default-features = false, features = ["macros"] }

# Add these explicit overrides just to forcefully gatekeep them from std
either = { version = "1.15.0", default-features = false }
castaway = { version = "0.2.4", default-features = false }
mousefood = "0.5.0"
libm = "0.2.16"
embedded-sdmmc = "0.9.0"
embedded-hal = "1.0.0"

[profile.dev]
opt-level = "s"

[profile.release]
opt-level = "s"
lto = "fat"
