[package]
name = "esp-csi-litetui-rs"
version = "0.2.0"
edition = "2024"
description = "Handheld Wi-Fi CSI scope for the M5Stack CoreS3 SE (ESP32-S3)"
license = "Apache-2.0"

[dependencies]
# --- CSI driver (pins the whole esp-* ecosystem below) ---
esp-csi-rs = { version = "0.11", features = ["esp32s3", "statistics"] }

# --- Core HAL / runtime / radio (versions matched to esp-csi-rs 0.11) ---
esp-hal = { version = "1.1", features = ["esp32s3", "unstable"] }
esp-rtos = { version = "0.3.0", features = ["embassy", "esp32s3", "esp-radio"] }
esp-radio = { version = "0.18.0", default-features = false, features = [
    "esp32s3",
    "wifi",
    "sniffer",
    "csi",
    "esp-alloc",
    "unstable",
] }
esp-alloc = "0.10.0"
esp-backtrace = { version = "0.19.0", features = ["panic-handler", "esp32s3"] }
esp-println = { version = "0.17.0", default-features = false, features = [
    "esp32s3",
] }
esp-bootloader-esp-idf = { version = "0.5.0", features = ["esp32s3"] }

# --- Async ---
embassy-executor = "0.10.0"
embassy-time = "0.5.0"
embassy-futures = "0.1.2"
static_cell = "2.1.1"

# --- Serialization (binary SD logging: postcard + COBS) ---
postcard = { version = "1.1.3", default-features = false }
serde = { version = "1.0.228", default-features = false }

# --- Display / TUI rendered to the on-board LCD ---
ratatui = { version = "0.30.0", default-features = false, features = ["macros"] }
mousefood = "0.5.0"
embedded-graphics = "0.8.1"
display-interface-spi = "0.5.0"
mipidsi = "0.8.0"
embedded-hal = "1.0.0"
embedded-hal-bus = "0.2.0"
embedded-sdmmc = "0.9.0"

# --- Math ---
micromath = "2.1.0"
libm = "0.2.16"

# Force no-std on transitive crates that can otherwise pull in std.
either = { version = "1.15.0", default-features = false }
castaway = { version = "0.2.4", default-features = false }

# esp-csi-rs 0.11 (the node model) is not on crates.io yet. Drop this once it publishes.
#
# `esp-csi-rs-core` is gone from here: that crate was deprecated and folded back into `esp-csi-rs`,
# so patching it pinned a dependency this build no longer has.
[patch.crates-io]
esp-csi-rs = { path = "../esp-csi-rs" }

[profile.dev]
opt-level = "s"

[profile.dev.package."*"]
# HAL / radio / graphics are performance critical even in debug builds.
opt-level = 3

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
